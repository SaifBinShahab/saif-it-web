<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 870" width="640" height="870" role="img" aria-label="Abstract geometric shield artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0E171A"/>
      <stop offset="0.55" stop-color="#0A1012"/>
      <stop offset="1" stop-color="#06090B"/>
    </linearGradient>

    <radialGradient id="halo" cx="64%" cy="25%" r="64%">
      <stop offset="0" stop-color="#4FC0A0" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#2C6E5D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0A1012" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2DDB0"/>
      <stop offset="0.45" stop-color="#C49A5F"/>
      <stop offset="1" stop-color="#6B512E"/>
    </linearGradient>

    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD3B0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#2E8C74" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#153F36" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#06090B" stop-opacity="0"/>
      <stop offset="1" stop-color="#06090B" stop-opacity="0.94"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2DDB0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2DDB0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2DDB0" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="640" height="870" fill="url(#bg)"/>
  <rect width="640" height="870" fill="url(#halo)"/>

  <!-- faint technical grid -->
  <g opacity="0.14" stroke="#7FA99B" stroke-width="0.6">
    <path d="M0 64H640M0 128H640M0 192H640M0 256H640M0 320H640M0 384H640M0 448H640M0 512H640M0 576H640M0 640H640M0 704H640M0 768H640M0 832H640"/>
    <path d="M64 0V870M128 0V870M192 0V870M256 0V870M320 0V870M384 0V870M448 0V870M512 0V870M576 0V870"/>
  </g>

  <!-- ground glow -->
  <ellipse cx="330" cy="585" rx="250" ry="64" fill="#0B2A24" opacity="0.45" filter="url(#soft)"/>

  <!-- orbit rings -->
  <ellipse cx="330" cy="358" rx="250" ry="96" fill="none" stroke="#B08D57" stroke-opacity="0.2" stroke-width="1" transform="rotate(-12 330 358)"/>
  <ellipse cx="330" cy="358" rx="208" ry="74" fill="none" stroke="#4FC0A0" stroke-opacity="0.16" stroke-width="1" transform="rotate(9 330 358)"/>

  <!-- light beam -->
  <path d="M300 80 L520 470 L460 490 L250 105 Z" fill="url(#beam)" opacity="0.55"/>

  <!-- shield -->
  <g transform="translate(330 340)">
    <!-- soft aura -->
    <polygon points="0,-196 172,-100 172,100 0,196 -172,100 -172,-100" fill="#2E8C74" opacity="0.22" filter="url(#soft)"/>

    <!-- outer shell -->
    <polygon points="0,-196 172,-100 172,100 0,196 -172,100 -172,-100" fill="url(#jade)" stroke="url(#brass)" stroke-width="2"/>
    <polygon points="0,-196 172,-100 172,100 0,196 -172,100 -172,-100" fill="none" stroke="#5FD3B0" stroke-opacity="0.28" stroke-width="0.8"/>

    <!-- inner plates -->
    <polygon points="0,-166 146,-85 146,85 0,166 -146,85 -146,-85" fill="none" stroke="#B08D57" stroke-opacity="0.5" stroke-width="1"/>
    <polygon points="0,-132 116,-68 116,68 0,132 -116,68 -116,-68" fill="none" stroke="#5FD3B0" stroke-opacity="0.32" stroke-width="0.9"/>

    <!-- facets -->
    <g stroke="#B08D57" stroke-opacity="0.32" stroke-width="0.9" fill="none">
      <path d="M0-196V196M-172-100L172 100M172-100L-172 100"/>
      <path d="M0-166L146 85M0-166L-146 85M0 166L146-85M0 166L-146-85"/>
    </g>

    <!-- centre prism -->
    <g>
      <polygon points="0,-78 68,-38 68,38 0,78 -68,38 -68,-38" fill="#0B1F1B" opacity="0.6" stroke="url(#brass)" stroke-width="1.2"/>
      <polygon points="0,-52 44,-24 44,24 0,52 -44,24 -44,-24" fill="none" stroke="#5FD3B0" stroke-opacity="0.55" stroke-width="1"/>
      <polygon points="0,-52 44,24 -44,24" fill="#4FC0A0" opacity="0.12"/>
      <polygon points="0,52 44,-24 -44,-24" fill="#F2DDB0" opacity="0.08"/>
    </g>

    <!-- network nodes -->
    <g fill="#F2DDB0">
      <circle cx="0" cy="-196" r="4"/>
      <circle cx="172" cy="-100" r="3.4"/>
      <circle cx="172" cy="100" r="3.4"/>
      <circle cx="0" cy="196" r="4"/>
      <circle cx="-172" cy="100" r="3.4"/>
      <circle cx="-172" cy="-100" r="3.4"/>
    </g>
    <g fill="#5FD3B0" opacity="0.9">
      <circle cx="0" cy="-166" r="2.4"/>
      <circle cx="146" cy="85" r="2.2"/>
      <circle cx="-146" cy="85" r="2.2"/>
      <circle cx="0" cy="166" r="2.4"/>
    </g>

    <!-- glow ring -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#5FD3B0" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 9"/>
  </g>

  <!-- dust -->
  <g fill="#F4F1EA">
    <circle cx="118" cy="196" r="1.6" opacity="0.6"/>
    <circle cx="522" cy="246" r="1.3" opacity="0.5"/>
    <circle cx="486" cy="118" r="1.8" opacity="0.7"/>
    <circle cx="164" cy="432" r="1.2" opacity="0.45"/>
    <circle cx="552" cy="402" r="1.5" opacity="0.4"/>
    <circle cx="94" cy="330" r="1.1" opacity="0.35"/>
    <circle cx="404" cy="86" r="1.2" opacity="0.5"/>
    <circle cx="250" cy="520" r="1.4" opacity="0.35"/>
  </g>

  <!-- legibility fade for the cover text -->
  <rect width="640" height="870" fill="url(#fade)"/>
</svg>
